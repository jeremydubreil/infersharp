name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  INFER_VERSION: v1.1.0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download Infer
        env:
          GH_TOKEN: ${{ github.token }}
        # The Linux package is named infer-linux64-* up to v1.1.0 and
        # infer-linux-x86_64-* from v1.2.0.
        run: |
          gh release download "$INFER_VERSION" \
            --repo facebook/infer \
            --pattern "infer-linux*-$INFER_VERSION.tar.xz" \
            --output "$RUNNER_TEMP/infer.tar.xz"
          mkdir "$RUNNER_TEMP/infer"
          tar -xJf "$RUNNER_TEMP/infer.tar.xz" -C "$RUNNER_TEMP/infer" --strip-components=1
          echo "$RUNNER_TEMP/infer/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          dotnet --version
          infer --version

      - name: Run tests
        run: dotnet test Cilsil.Test/Cilsil.Test.csproj --logger "console;verbosity=normal"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            Cilsil.Test/bin/Debug/net6.0/artifacts/**/TestCode.cs
            Cilsil.Test/bin/Debug/net6.0/artifacts/**/infer-out/report.json
          if-no-files-found: ignore
